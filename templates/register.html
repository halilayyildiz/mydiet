<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>MyDiet Register</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=asset_version) }}">
    <link rel="manifest" href="{{ url_for('static', filename='manifest.webmanifest', v=asset_version) }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/apple-touch-icon.png', v=asset_version) }}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MyDiet">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#111514" media="(prefers-color-scheme: dark)">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v=asset_version) }}">
  </head>
  <body class="login-body">
    <main class="login-panel">
      <div class="brandmark login-brand">
        <img class="brand-icon" src="{{ url_for('static', filename='favicon.svg', v=asset_version) }}" alt="">
        <span>MyDiet</span>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="login-flash-stack">
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      <form method="post" class="stack-form">
        <label>
          {{ t.username }}
          <input name="username" value="{{ request.form.username or '' }}" autocomplete="username" required autofocus>
        </label>
        <label>
          {{ t.password }}
          <input name="password" type="password" autocomplete="new-password" required>
        </label>
        <button type="submit">{{ t.create_account }}</button>
      </form>
      <p class="auth-switch">
        {{ t.have_account }} <a href="{{ url_for('login') }}">{{ t.enter }}</a>
      </p>
    </main>
  </body>
</html>
