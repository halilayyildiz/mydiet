<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MyDiet{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v=asset_version) }}">
  </head>
  <body>
    <header class="site-header">
      <details class="nav-menu">
        <summary class="menu-button" aria-label="Open navigation menu">
          <span></span>
          <span></span>
          <span></span>
        </summary>
        <nav class="menu-panel" aria-label="Primary navigation">
          <div class="menu-title">MyDiet</div>
          <a class="{{ 'active' if active_page == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}">Dashboard</a>
          <a class="{{ 'active' if active_page == 'entry' else '' }}" href="{{ url_for('entry_form') }}">Entry</a>
          <a class="{{ 'active' if active_page == 'weight' else '' }}" href="{{ url_for('weight') }}">Weight</a>
          <a class="{{ 'active' if active_page == 'profile' else '' }}" href="{{ url_for('profile') }}">Profile</a>
        </nav>
      </details>
      <a class="brandmark" href="{{ url_for('dashboard') }}" aria-label="MyDiet home">
        <span class="brand-icon">M</span>
        <span>MyDiet</span>
      </a>
      <form class="logout-form" action="{{ url_for('logout') }}" method="post">
        <button class="logout-button" type="submit">Log out</button>
      </form>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='forms.js', v=asset_version) }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
