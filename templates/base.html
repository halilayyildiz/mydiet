<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MyDiet{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brandmark" href="{{ url_for('dashboard') }}" aria-label="MyDiet home">
        <span class="brand-icon">M</span>
        <span>MyDiet</span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        <a class="{{ 'active' if active_page == 'dashboard' else '' }}" href="{{ url_for('dashboard') }}">Dashboard</a>
        <a class="{{ 'active' if active_page == 'entry' else '' }}" href="{{ url_for('entry_form') }}">Entry</a>
        <a class="{{ 'active' if active_page == 'weight' else '' }}" href="{{ url_for('weight') }}">Weight</a>
        <a class="{{ 'active' if active_page == 'profile' else '' }}" href="{{ url_for('profile') }}">Profile</a>
      </nav>
      <form action="{{ url_for('logout') }}" method="post">
        <button class="logout-button" type="submit">Log out</button>
      </form>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='forms.js') }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
