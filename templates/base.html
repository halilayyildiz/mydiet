<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MyDiet{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v=asset_version) }}">
  </head>
  <body>
    <header class="site-header">
      <a class="brandmark" href="{{ url_for('dashboard') }}" aria-label="MyDiet home">
        <span class="brand-icon">M</span>
        <span>MyDiet</span>
      </a>
      <form class="language-form" action="{{ url_for('set_language') }}" method="post" aria-label="{{ t.language }}">
        <input type="hidden" name="next" value="{{ request.full_path }}">
        <select name="lang" aria-label="{{ t.language }}" onchange="this.form.submit()">
          <option value="tr" {{ 'selected' if lang == 'tr' else '' }}>TR</option>
          <option value="en" {{ 'selected' if lang == 'en' else '' }}>EN</option>
        </select>
      </form>
      <details class="account-menu">
        <summary class="account-button" aria-label="{{ username }}">
          <span>{{ username }}</span>
        </summary>
        <div class="account-panel">
          <a class="{{ 'active' if active_page == 'profile' else '' }}" href="{{ url_for('profile') }}">{{ t.profile }}</a>
          <form action="{{ url_for('logout') }}" method="post">
            <button type="submit">{{ t.log_out }}</button>
          </form>
        </div>
      </details>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="flash-stack">
          {% for category, message in messages %}
            <div class="flash {{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <main class="page-shell">
      {% block content %}{% endblock %}
    </main>

    <script>
      window.MYDIET_FORM_TEXT = {{ {"saving": t.saving} | tojson }};
    </script>
    <script src="{{ url_for('static', filename='forms.js', v=asset_version) }}" defer></script>
    {% block scripts %}{% endblock %}
  </body>
</html>
