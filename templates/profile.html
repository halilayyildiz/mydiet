{% extends "base.html" %}
{% block title %}{{ t.profile }} · MyDiet{% endblock %}

{% block content %}
  <section class="toolbar">
    <div>
      <p class="eyebrow">{{ t.personal_settings }}</p>
      <h1>{{ t.profile }}</h1>
    </div>
  </section>

  <form
    class="profile-grid"
    method="post"
    data-loading-form
    data-loading-message="{{ t.saving_profile }}"
  >
    <div class="form-status" data-loading-status hidden>
      <span class="spinner" aria-hidden="true"></span>
      <span data-loading-status-text></span>
    </div>
    <label>
      {{ t.name }}
      <input name="name" value="{{ profile.name or '' }}" autocomplete="name">
    </label>
    <label>
      {{ t.age }}
      <input type="number" name="age" value="{{ profile.age or '' }}" min="1" max="120">
    </label>
    <label>
      {{ t.gender }}
      <select name="gender">
        {% for value, label in [('male', t.male), ('female', t.female), ('other', t.other)] %}
          <option value="{{ value }}" {{ 'selected' if profile.gender == value else '' }}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      {{ t.height }}
      <input type="number" name="height_cm" value="{{ profile.height_cm or '' }}" min="80" max="240">
      <span>cm</span>
    </label>
    <label>
      {{ t.current_weight }}
      <input type="number" name="weight_kg" value="{{ profile.weight_kg or '' }}" step="0.1" min="20" max="300">
      <span>kg</span>
    </label>
    <label>
      {{ t.goal_weight }}
      <input type="number" name="goal_weight_kg" value="{{ profile.goal_weight_kg or '' }}" step="0.1" min="20" max="300">
      <span>kg</span>
    </label>
    <label>
      {{ t.activity_level }}
      <select name="activity_level">
        {% for value, label in [('low', t.low), ('moderate', t.moderate), ('high', t.high)] %}
          <option value="{{ value }}" {{ 'selected' if profile.activity_level == value else '' }}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <label>
      {{ t.goal }}
      <select name="goal">
        {% for value, label in [('fat_loss', t.fat_loss), ('maintenance', t.maintenance), ('muscle_gain', t.muscle_gain)] %}
          <option value="{{ value }}" {{ 'selected' if profile.goal == value else '' }}>{{ label }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit" data-loading-label="{{ t.saving }}">{{ t.save_profile }}</button>
  </form>
{% endblock %}
