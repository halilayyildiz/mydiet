<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyDiet Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v=asset_version) }}">
  </head>
  <body class="login-body">
    <main class="login-panel">
      <div class="brandmark login-brand">
        <span class="brand-icon">M</span>
        <span>MyDiet</span>
      </div>
      <form method="post" class="stack-form">
        <label>
          {{ t.username }}
          <input name="username" value="halil" autocomplete="username" required autofocus>
        </label>
        <label>
          {{ t.password }}
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">{{ t.enter }}</button>
      </form>
    </main>
  </body>
</html>
