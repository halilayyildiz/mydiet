<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MyDiet Login</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg', v=asset_version) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css', v=asset_version) }}">
  </head>
  <body class="login-body">
    <main class="login-panel">
      <div class="brandmark login-brand">
        <span class="brand-icon">M</span>
        <span>MyDiet</span>
      </div>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          <div class="login-flash-stack">
            {% for category, message in messages %}
              <div class="flash {{ category }}">{{ message }}</div>
            {% endfor %}
          </div>
        {% endif %}
      {% endwith %}
      <form method="post" class="stack-form">
        <label>
          {{ t.username }}
          <input name="username" value="{{ username }}" autocomplete="username" required autofocus>
        </label>
        <label>
          {{ t.password }}
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">{{ t.enter }}</button>
      </form>
      <p class="auth-switch">
        <a href="{{ url_for('register') }}">{{ t.register }}</a>
      </p>
    </main>
  </body>
</html>
