[project]
name = "mydiet"
version = "0.1.0"
description = "Personal diet dashboard with SQLite storage and Claude-powered diary analysis."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "flask>=3.0.0",
  "anthropic>=2.2.0",
  "gunicorn>=23.0.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.6.0",
]

[project.scripts]
mydiet = "mydiet.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mydiet"]

[tool.ruff]
line-length = 100
target-version = "py311"
